plugins { id 'com.android.application' }
android {
 namespace 'com.findback.app'
 compileSdk 35
 defaultConfig { applicationId 'com.findback.app'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.4.0'; ndk { abiFilters 'arm64-v8a' }; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes {
  debug { }
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
  }
  demo {
   initWith release
   signingConfig signingConfigs.debug
   matchingFallbacks = ['release']
  }
 }

 androidResources { noCompress 'onnx' }
}
dependencies {
 implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.camera:camera-core:1.4.2'
 implementation 'androidx.camera:camera-camera2:1.4.2'
 implementation 'androidx.camera:camera-lifecycle:1.4.2'
 implementation 'androidx.camera:camera-view:1.4.2'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
 implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'
 implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
 testImplementation 'junit:junit:4.13.2'
}

// Keep large weights out of Git; a fresh Android Studio build fetches and verifies YOLO.
tasks.register('prepareYolo', Exec) {
 workingDir rootProject.projectDir
 commandLine 'bash', rootProject.file('scripts/fetch-model.sh').absolutePath
 inputs.file rootProject.file('scripts/fetch-model.sh')
 outputs.file file('src/main/assets/yolov8n.onnx')
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareYolo') }

// Developer-only provisioning. The installed app exposes no model setup or download controls.
tasks.register('prepareAssistant', Exec) {
 workingDir rootProject.projectDir
 commandLine 'bash', rootProject.file('scripts/fetch-assistant.sh').absolutePath
 inputs.file rootProject.file('scripts/fetch-assistant.sh')
 outputs.file rootProject.file('.assistant-models/gemma-4-E2B-it.litertlm')
}
tasks.register('runOnPhone', Exec) {
 dependsOn tasks.named('assembleDebug'), tasks.named('prepareAssistant')
 workingDir rootProject.projectDir
 commandLine 'python3', rootProject.file('scripts/provision-phone.py').absolutePath,
   '--adb', new File(android.sdkDirectory, 'platform-tools/adb').absolutePath,
   '--apk', layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile.absolutePath,
   '--model', rootProject.file('.assistant-models/gemma-4-E2B-it.litertlm').absolutePath
}
